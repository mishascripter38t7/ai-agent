name: AI Agent Autonomous Loop

on:
  schedule:
    - cron: '0 */6 * * *' # Запуск каждые 6 часов
  workflow_dispatch:      # Возможность запустить вручную кнопкой на GitHub

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Нужно, чтобы агент мог сам делать git push

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run AI Agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }} # Бесплатный ключ LLM
        run: |
          python scripts/agent.py

      - name: Commit and push changes if agent wrote something
        run: |
          git config --global user.name "AI Autonomous Agent"
          git config --global user.email "agent@bot.local"
          git add memory/
          git diff --staged --quiet || (git commit -m "🤖 Agent self-update: diary and state" && git push)
